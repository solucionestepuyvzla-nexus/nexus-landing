services:
  # ----------------------------------------------------
  # 1. SERVICIO CACHÉ & PUB/SUB DE ALTA ESCALA (REDIS 7)
  # ----------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: tepuy_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - tepuy_network

  # ----------------------------------------------------
  # 2. BACKEND ASÍNCRONO FASTAPI (1M+ CONCURRENCIA)
  # ----------------------------------------------------
  backend:
    build:
      context: ./backend-fastapi
      dockerfile: Dockerfile
    container_name: tepuy_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - POSTGRES_SERVER=host.docker.internal
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=tepuy_condo_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SECRET_KEY=tepuy-condo-nexus-ultra-secure-secret-key-32chars-minimum-token
      - CORS_ORIGINS=["http://localhost:5173","http://localhost:3000","http://localhost:8085"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis
    volumes:
      - ./backend-fastapi:/app
    networks:
      - tepuy_network

  # ----------------------------------------------------
  # 3. PORTAL WEB DEL ADMINISTRADOR (REACT + NGINX)
  # ----------------------------------------------------
  frontend:
    build:
      context: ./frontend-admin-web
      dockerfile: Dockerfile
    container_name: tepuy_frontend_admin
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - tepuy_network

volumes:
  redis_data:
    driver: local

networks:
  tepuy_network:
    driver: bridge
